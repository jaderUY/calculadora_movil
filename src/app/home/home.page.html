<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Calculadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="display-screen">{{display}}</div>

  <ion-grid>
    <!-- primera fila-->
    <ion-row>
      <ion-col><ion-button expand="block" (click)="limpiarDisplay()">AC</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="eliminar()">DEL</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="ponerOperacion('^')">^</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="ponerOperacion('/')">/</ion-button></ion-col>
    </ion-row>

    <!-- segunda fila -->
    <ion-row>
      <ion-col><ion-button expand="block" (click)="operacionTrigonometrica('sqrt')">√</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="operacionTrigonometrica('sin')">sin</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="operacionTrigonometrica('cos')">cos</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="operacionTrigonometrica('tan')">tan</ion-button></ion-col>
    </ion-row>

    <!-- tercera fila -->
    <ion-row>
      <ion-col><ion-button expand="block" (click)="anadirNumero('7')">7</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('8')">8</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('9')">9</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="ponerOperacion('*')">x</ion-button></ion-col>
    </ion-row>

    <!-- cuarta fila -->
    <ion-row>
      <ion-col><ion-button expand="block" (click)="anadirNumero('4')">4</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('5')">5</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('6')">6</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="ponerOperacion('-')">-</ion-button></ion-col>
    </ion-row>

    <!-- quinta fila -->
    <ion-row>
      <ion-col><ion-button expand="block" (click)="anadirNumero('1')">1</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('2')">2</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirNumero('3')">3</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="ponerOperacion('+')">+</ion-button></ion-col>
    </ion-row>

    <!-- sexta fila -->
    <ion-row>
      <ion-col size="6"><ion-button expand="block" (click)="anadirNumero('0')">0</ion-button></ion-col>
      <ion-col><ion-button expand="block" (click)="anadirDecimal()">.</ion-button></ion-col>
      <ion-col><ion-button expand="block" color="success" (click)="calcular()">=</ion-button></ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
